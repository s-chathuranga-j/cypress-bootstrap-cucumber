name: BrowserStack Accessibility

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'cypress/**'
      - 'browserstack.template.json'
      - 'cypress.config.ts'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/browserstack-accessibility.yml'

jobs:
  browserstack-accessibility:
    runs-on: ubuntu-latest
    env:
      BROWSERSTACK_USERNAME: ${{ secrets.BROWSERSTACK_USERNAME }}
      BROWSERSTACK_ACCESS_KEY: ${{ secrets.BROWSERSTACK_ACCESS_KEY }}
      CYPRESS_BASE_URL: https://www.saucedemo.com/
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Generate BrowserStack config
        run: npm run browserstack:config

      - name: Run BrowserStack accessibility suite
        run: npm run browserstack:a11y
